[workspace]
resolver = "2"
members = ["shared", "server", "client"]
# Built separately by build.ps1 after the client is packaged (it embeds the client).
exclude = ["portable"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
systemdeck-core = { path = "shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
rand = "0.8"
chacha20poly1305 = "0.10"
redb = "2"
hex = "0.4"

# Patched IronRDP: tolerate undecodable Fast-Path pointer (cursor) updates instead
# of dropping the whole RDP session. See vendor/ironrdp-session/src/fast_path.rs.
[patch.crates-io]
ironrdp-session = { path = "vendor/ironrdp-session" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
